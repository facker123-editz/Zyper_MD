services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zypher-md-bot
    restart: always
    ports:
      - "9090:9090"
      - "8000:8000"
      - "3000:3000"
    volumes:
      # Persist WhatsApp session files so reconnecting is not needed
      - ./sessions:/app/sessions
      # Persist local store / database files
      - ./store:/app/store
      # Live sync plugins folder
      - ./plugins:/app/plugins
      # Live sync public web dashboard
      - ./public:/app/public
    environment:
      - PORT=9090
      - CALL_PORT=3000
      - NODE_ENV=production

